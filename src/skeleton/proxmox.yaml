# pve:
#   url: https://proxmox.host.or.ip:8006
#   token: username@pam!Token ID
#   secret: secret

# SMART/disk health monitoring reads its SSH connection details from a block
# like this. Uncomment and fill it in to enable the Disks section on the
# dashboard — see deploy/SSH_SETUP.md for the restricted SSH key setup this
# depends on.
# install.sh already places the private key at config/ssh/id_smart, so most
# installs only need to uncomment these three lines and set the right host.
# smart:
#   host: proxmox.host.or.ip
#   username: root
#   privateKeyPath: ./config/ssh/id_smart
